name: Publish Anki add-on

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released version
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build add-on package
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          artifact="${REPOSITORY_NAME}-${RELEASE_TAG}.ankiaddon"
          zip -9 -X -r "$artifact" \
            __init__.py \
            editor.py \
            manifest.json \
            vendor
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "${{ steps.package.outputs.artifact }}"
          --clobber
